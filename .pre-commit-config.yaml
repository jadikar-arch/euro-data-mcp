# Git hooks, run by prek (https://github.com/j178/prek) or pre-commit.
#   uv run prek install          # run on every commit
#   uv run prek run --all-files  # check the whole repo
exclude: ^(uv\.lock|LICENSE)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest (offline, mocked APIs)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types: [python]

[project]
name = "cbs-mcp"
version = "0.1.0"
description = "Token-efficient MCP server for CBS (Statistics Netherlands) open data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "platformdirs>=4.12.4",
]

[project.scripts]
cbs-mcp = "cbs_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbs_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real CBS API (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[project]
name = "europa-mcp"
version = "0.2.0"
description = "MCP server that lets AI assistants find and fetch official open data from EU institutions (Eurostat, European Commission, European Parliament, data.europa.eu) and European countries, with source and licence on every answer"
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Munirdin Jadikar" }]
keywords = ["mcp", "open-data", "eurostat", "data.europa.eu", "european-parliament", "statistics", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "platformdirs>=4.12.4",
]

[project.scripts]
europa-mcp = "europa_mcp.server:main"

[project.urls]
Repository = "https://github.com/jadikar-arch/euro-data-mcp"
Changelog = "https://github.com/jadikar-arch/euro-data-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/europa_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real APIs (deselect with -m 'not live')"]
addopts = "-m 'not live'"

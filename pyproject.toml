[project]
name = "europa-mcp"
version = "0.4.3"
description = "MCP server that lets AI assistants find and fetch public open data from Eurostat, the European Parliament, data.europa.eu and national statistics offices, with source and licence on every answer"
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Munirdin Jadikar" }]
keywords = ["mcp", "open-data", "eurostat", "data.europa.eu", "european-parliament", "statistics", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastmcp>=4.1.0,<5",  # uses FastMCP internals (skills provider, protocol detection)
    "httpx>=0.28.1",
    "mcp>=2.3.0",  # imported directly (mcp.types)
    "platformdirs>=4.12.4",
]

[project.scripts]
europa-mcp = "europa_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jadikar-arch/euro-data-mcp"
Issues = "https://github.com/jadikar-arch/euro-data-mcp/issues"
Repository = "https://github.com/jadikar-arch/euro-data-mcp"
Changelog = "https://github.com/jadikar-arch/euro-data-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".claude", "deploy", ".vscode", ".github", ".pre-commit-config.yaml", ".python-version", ".dockerignore", "eval", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/europa_mcp"]

[dependency-groups]
dev = [
    "prek>=0.5.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real APIs (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines: the formatter wraps what it can; long strings/tables stay readable

[tool.ruff.lint.per-file-ignores]
".claude/skills/*/templates/**" = ["F401", "I"]
